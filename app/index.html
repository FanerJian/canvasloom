<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>界面工坊 CanvasLoom</title>
<link rel="stylesheet" href="/app/styles.css?v=11">
</head>
<body>
<header id="topbar">
  <div class="tb-group tb-brand">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 18.5 12 5.5l5.5 13z" fill="#fff"/></svg>
    </span>
    <span class="tb-title">界面工坊</span>
    <span class="tb-sub">CanvasLoom</span>
  </div>

  <div class="tb-group proj">
    <span id="proj-name" class="proj-name">（未打开）</span>
    <span id="proj-mode" class="proj-mode" title="场景模式"></span>
    <span id="proj-status" class="proj-status"></span>
  </div>

  <div class="tb-menu-wrap hidden" id="variant-wrap">
    <button id="btn-variant" class="tb-btn" title="方案" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5" opacity=".45"/></svg>方案：<span id="variant-label"></span>
      <svg class="tb-caret" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>
    </button>
    <div id="variant-menu" class="tb-menu hidden"></div>
  </div>

  <div class="tb-menu-wrap hidden" id="page-wrap">
    <button id="btn-page" class="tb-btn" title="页面" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16" opacity=".45"/></svg>页面：<span id="page-label"></span>
      <svg class="tb-caret" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>
    </button>
    <div id="page-menu" class="tb-menu hidden"></div>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button id="btn-new" class="tb-btn" title="新建项目">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg>新建
    </button>
    <button id="btn-open" class="tb-btn" title="打开项目">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>打开
    </button>
    <button id="btn-save" class="tb-btn primary" title="保存（Ctrl+S）">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存
    </button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button id="btn-undo" class="tb-btn icon" title="撤销（Ctrl+Z）" aria-label="撤销">
      <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
    </button>
    <button id="btn-redo" class="tb-btn icon" title="重做（Ctrl+Y）" aria-label="重做">
      <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
    </button>
  </div>

  <div class="tb-menu-wrap" id="more-wrap">
    <button id="btn-more" class="tb-btn" title="更多" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>更多
      <svg class="tb-caret" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>
    </button>
    <div id="more-menu" class="tb-menu hidden">
      <button id="btn-copy" class="tb-btn" title="复制（Ctrl+C）" aria-label="复制">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制
      </button>
      <button id="btn-paste" class="tb-btn" title="粘贴（Ctrl+V）" aria-label="粘贴">
        <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>粘贴
      </button>
      <button id="btn-del" class="tb-btn" title="删除（Delete）" aria-label="删除">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>删除
      </button>
      <div class="tb-menu-sep"></div>
      <button id="btn-check" class="tb-btn" title="检查布局">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/></svg>检查布局
      </button>
      <button id="btn-upgrade-v3" class="tb-btn hidden" title="升级为 v3">
        <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>升级为 v3（页面与交互）…
      </button>
    </div>
  </div>

  <div class="tb-right">
    <div class="tb-group">
      <button id="btn-export" class="tb-btn" title="导出">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>导出
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <div class="seg" role="tablist" aria-label="编辑模式">
        <button id="btn-mode-design" class="seg-btn" role="tab">
          <svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>设计
        </button>
        <button id="btn-mode-preview" class="seg-btn" role="tab">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>预览
        </button>
      </div>
      <button id="btn-left-toggle" class="tb-btn icon" title="左侧面板" aria-label="左侧面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button id="btn-right-toggle" class="tb-btn icon" title="右侧面板" aria-label="右侧面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="workspace">
  <aside id="left">
    <div class="side-tabs" role="tablist" aria-label="左侧面板">
      <button id="tab-add" class="side-tab active" role="tab" aria-selected="true">添加</button>
      <button id="tab-tree" class="side-tab" role="tab" aria-selected="false">层级</button>
      <button id="tab-fs" class="side-tab" role="tab" aria-selected="false">风格</button>
    </div>
    <div id="left-page-add" class="left-page">
      <section class="side-sec">
        <h3>起步区域</h3>
        <div id="pal-regions"></div>
      </section>
      <section class="side-sec">
        <h3>预设块</h3>
        <div id="pal-blocks"></div>
      </section>
      <section class="side-sec">
        <h3>基础组件</h3>
        <div id="pal-list"></div>
        <div class="side-hint">点击添加，或拖拽至画布</div>
      </section>
    </div>
    <div id="left-page-tree" class="left-page hidden">
      <section class="side-sec grow">
        <h3>层级树</h3>
        <div id="tree" class="tree"></div>
        <div class="side-hint">拖拽节点可调整层级</div>
      </section>
    </div>
    <div id="left-page-fs" class="left-page hidden">
      <section class="side-sec grow">
        <div id="fs-panel" class="fs-panel"></div>
      </section>
    </div>
  </aside>

  <div id="center">
    <div id="canvas-wrap">
      <div id="canvas-stage">
        <div id="canvas-scaler">
          <div id="artboard"></div>
          <div id="overlay"></div>
        </div>
      </div>
    </div>
    <div id="preview-pane" class="hidden">
      <div id="pv-bar">
        <strong>预览</strong>
        <span id="pv-label"></span>
        <select id="pv-viewport"></select>
        <button id="pv-close" class="tb-btn">返回设计</button>
      </div>
      <div id="pv-stage"><iframe id="pv-frame" title="预览"></iframe></div>
    </div>
    <div id="zoom-pill">
      <button id="btn-zoom-out" class="zp-btn" title="缩小" aria-label="缩小">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <span id="zoom-label" class="zoom-label">100%</span>
      <button id="btn-zoom-in" class="zp-btn" title="放大" aria-label="放大">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="zp-sep"></span>
      <button id="btn-canvas-opts" class="zp-btn" title="画布选项" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>
      </button>
      <div id="canvas-opts-menu" class="zp-pop hidden">
        <button id="btn-snap" class="zp-btn" title="吸附参考线">吸附</button>
        <button id="btn-free-move" class="zp-btn active" title="自由移动">自由移动</button>
        <button id="btn-show-outside" class="zp-btn" title="显示画布外内容">画布外</button>
      </div>
      <span class="zp-sep"></span>
      <button id="btn-fit" class="zp-btn zp-wide" title="适应画布">适应</button>
    </div>
    <div id="empty-state" class="hidden">
      <div class="es-card">
        <div class="es-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 18.5 12 5.5l5.5 13z" fill="#fff"/></svg>
        </div>
        <h2>开始设计</h2>
        <p>新建项目，或打开已有设计</p>
        <div class="es-actions">
          <button id="es-new" class="tb-btn primary">新建项目</button>
          <button id="es-open" class="tb-btn">打开项目</button>
        </div>
      </div>
    </div>
  </div>

  <aside id="right">
    <div id="props"></div>
  </aside>
</main>

<footer id="statusbar">
  <span id="status-sel">未选中组件</span>
  <span class="status-right">
    <button id="btn-help" class="status-link" title="快捷键">快捷键</button>
  </span>
</footer>

<div id="modal-root"></div>
<div id="ctx-root"></div>
<div id="toast-root"></div>

<script src="/vendor/html2canvas.min.js"></script>
<script type="module" src="/app/main.js?v=11"></script>
</body>
</html>
